server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths must still serve the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
